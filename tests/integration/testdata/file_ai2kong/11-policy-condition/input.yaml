models:
  - type: model
    display_name: Guarded GPT
    name: guarded-gpt
    capabilities: [generate]
    formats: [{type: openai}]
    targets:
      - name: gpt-4o
        provider: openai-main
        config: {type: openai}
    policies: [pii-sanitizer]
    access:
      acls: {allow: [], deny: []}
    config:
      route: {paths: [/ai]}
model_providers:
  - type: openai
    display_name: OpenAI Main
    name: openai-main
    config:
      auth:
        type: basic
        headers: [{name: Authorization, value: "{vault://env/openai-key}"}]
policies:
  # AI Gateway 2.1 (#21179 KAG-8713): a policy may carry a condition, a Kong
  # expression that gates whether the plugin runs. It is lowered verbatim onto
  # the plugin's `condition`, so it uses the expression language's field names
  # (http.path, http.headers.*) rather than CEL's http.request.*. Model-scoped
  # policies get the condition on the plugin scoped to the model's route.
  - type: ai-prompt-guard
    name: pii-sanitizer
    condition: 'http.headers.x_tier == "premium"'
    config:
      allow_patterns: ["^safe"]
  # A global policy may also carry a condition.
  - type: rate-limiting
    name: org-wide-limit
    global: true
    condition: 'http.path == "/ai"'
    config:
      minute: 1000
      policy: local
