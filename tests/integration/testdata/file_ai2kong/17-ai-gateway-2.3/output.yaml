        header_name: Authorization
        header_value: '{vault://env/openai-key}'
      description: gpt-4o
      logging:
        log_payloads: false
        log_statistics: true
      model:
        model_alias: balanced-gpt
        name: gpt-4o
        provider: openai
      route_type: llm/v1/chat
