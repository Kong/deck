services:
- name: ai-gateway
  routes:
  - methods:
    - POST
    - OPTIONS
    name: openai-chat
    paths:
    - /ai/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-chat-2
    paths:
    - /baseten/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-chat-3
    paths:
    - /mantle/v1/chat/completions
    - /mantle/openai/v1/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-responses
    paths:
    - /mantle/v1/responses
    - /mantle/openai/v1/responses
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: anthropic-messages
    paths:
    - /mantle/v1/messages
    strip_path: false
  - methods:
    - GET
    - POST
    - OPTIONS
    name: bedrock-converse
    paths:
    - ~/runtime/model/(?<model_name>[^/]+)/converse(?:-stream)?
    strip_path: false
  - methods:
    - GET
    - POST
    - OPTIONS
    name: bedrock-invoke
    paths:
    - ~/runtime/model/(?<model_name>[^/]+)/invoke(?:-with-response-stream)?
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: bedrock-chat
    paths:
    - /runtime/openai/v1/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: bedrock-messages
    paths:
    - /runtime/anthropic/v1/messages
    strip_path: false
  - methods:
    - GET
    - POST
    - OPTIONS
    name: gemini-responses
    paths:
    - /gemini/v1/interactions
    strip_path: false
  - methods:
    - GET
    - POST
    - OPTIONS
    name: gemini-beta-responses
    paths:
    - /gemini/v1beta/interactions
    strip_path: false
  url: http://ai-gateway.upstream.local
- name: limited-vendor-mcp
  routes:
  - name: limited-vendor-mcp-route
    paths:
    - /mcp/vendor
    plugins:
    - config:
        include_consumer_groups: true
        logging:
          log_audits: false
          log_payloads: false
          log_statistics: true
        mode: passthrough-listener
        rate_limiting:
          limits:
          - limit: 100
            method: tools/call
            window_size: 60
          - limit: 10
            tool: search_flights
            window_size: 1
        tools: []
      name: ai-mcp-proxy
  url: https://mcp.internal.kongair.com
- name: limited-flights-mcp
  routes:
  - name: limited-flights-mcp-route
    paths:
    - /mcp/flights
    plugins:
    - config:
        include_consumer_groups: true
        logging:
          log_audits: false
          log_payloads: false
          log_statistics: true
        mode: conversion-listener
        rate_limiting:
          limits:
          - limit: 1000
            tool: search_flights
            window_size: 86400
          - limit: 100
            tool: search_flights
            window_size: 3600
          - limit: 50
            method: tools/list
            window_size: 60
        tools:
        - description: Search flights
          method: GET
          name: search_flights
          path: /flights
      name: ai-mcp-proxy
  url: https://flights.internal.kongair.com
- name: partner-flights-mcp
  routes:
  - name: partner-flights-mcp-route
    paths:
    - /mcp/partner-flights
    plugins:
    - config:
        default_acl:
        - allow_when:
          - has(principal.metadata.tier) && principal.metadata.tier == 'gold'
          deny_when:
          - has(principal.metadata.status) && principal.metadata.status == 'suspended'
        include_consumer_groups: true
        logging:
          log_audits: false
          log_payloads: false
          log_statistics: true
        mode: conversion-listener
        tools:
        - description: Search flights
          method: GET
          name: search_flights
          path: /flights
        - acl:
            allow_when:
            - has(principal.metadata.role) && principal.metadata.role == 'buyer'
          description: Book a flight
          method: POST
          name: book_flight
          path: /bookings
      name: ai-mcp-proxy
  url: https://flights.internal.kongair.com
