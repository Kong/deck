    strip_path: false
  url: http://ai-gateway.upstream.local
- host: vendor-mcp-upstream
  name: vendor-mcp
  protocol: https
  routes:
  - name: vendor-mcp-route
    paths:
    - /mcp/vendor
    plugins:
    - config:
        include_consumer_groups: true
        logging:
          log_audits: false
          log_payloads: false
          log_statistics: true
        mode: passthrough-listener
        tools: []
      name: ai-mcp-proxy
- host: booking-upstream
  name: booking
  path: /a2a
  protocol: https
  routes:
  - name: booking-route
    paths:
    - /booking
    plugins:
    - config:
        logging:
          log_payloads: false
          log_statistics: true
          max_payload_size: 1048576
      name: ai-a2a-proxy
upstreams:
- algorithm: consistent-hashing
  hash_on: header
  hash_on_header: Mcp-Session-Id
  healthchecks:
    active:
      healthy:
        interval: 10
        successes: 2
      type: tcp
      unhealthy:
        interval: 10
        tcp_failures: 3
        timeouts: 3
    passive:
      type: tcp
      unhealthy:
        tcp_failures: 3
        timeouts: 3
  name: vendor-mcp-upstream
  targets:
  - target: vendor-1.internal:8443
    weight: 200
  - target: vendor-2.internal:8443
- algorithm: consistent-hashing
  hash_on: header
  hash_on_header: X-Session
  healthchecks:
    active:
      healthy:
        interval: 10
        successes: 2
      type: tcp
      unhealthy:
        interval: 10
        tcp_failures: 3
        timeouts: 3
    passive:
      type: tcp
      unhealthy:
        tcp_failures: 3
        timeouts: 3
  name: booking-upstream
  targets:
  - target: booking-1.internal:8443
    weight: 200
  - target: booking-2.internal:8443
