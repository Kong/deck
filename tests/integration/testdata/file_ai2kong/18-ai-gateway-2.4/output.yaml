services:
- name: ai-gateway
  routes:
  - methods:
    - POST
    - OPTIONS
    name: openai-chat
    paths:
    - /ai/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-decisions
    paths:
    - /ai/v1/decisions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-chat-2
    paths:
    - /pinned/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-chat-3
    paths:
    - /fireworks/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-responses
    paths:
    - /fireworks/responses
    strip_path: false
  - methods:
    - GET
    - POST
    - DELETE
    - OPTIONS
    name: openai-responses-lifecycle
    paths:
    - ~/fireworks/responses/.+
    strip_path: false
    tags:
    - aigw:responses-lifecycle
  - methods:
    - POST
    - OPTIONS
    name: anthropic-messages
    paths:
    - /fireworks/v1/messages
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-chat-4
    paths:
    - /together/chat/completions
    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-responses-2
    paths:
