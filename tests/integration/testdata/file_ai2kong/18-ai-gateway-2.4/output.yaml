    strip_path: false
  - methods:
    - POST
    - OPTIONS
    name: openai-responses-3
    paths:
    - /meta/responses
    strip_path: false
  - methods:
    - GET
    - POST
    - DELETE
    - OPTIONS
    name: openai-responses-lifecycle-3
