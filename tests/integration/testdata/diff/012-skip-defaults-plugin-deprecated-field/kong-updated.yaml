_format_version: "3.0"
# Same plugin as kong.yaml with a genuine issuer change, to assert clearing the unmatched
# deprecated field does not swallow real plugin updates.
services:
  - name: example
    host: example.com
_plugin_configs:
  my-oidc-config:
    session_memcached_ssl: false
    consumer_by:
      - custom_id
    consumer_claim:
      - clientId
    issuer: https://changed-issuer.example.com
    cache_tokens_salt: xxxxxx
    auth_methods:
      - bearer
plugins:
  - _config: my-oidc-config
    enabled: true
    name: openid-connect
    protocols:
      - https
    service: example
