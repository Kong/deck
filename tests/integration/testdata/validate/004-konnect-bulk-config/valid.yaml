_format_version: "3.0"
services:
- id: 0b5c1d3e-0001-4000-8000-000000000001
  name: bulk-svc-1
  host: example.com
  port: 80
  protocol: http
  routes:
  - id: 0b5c1d3e-0002-4000-8000-000000000001
    name: bulk-route-1
    paths:
    - /bulk-1
    headers:
      x-bulk:
      - one
      - two
    plugins:
    - id: 0b5c1d3e-0003-4000-8000-000000000001
      name: key-auth
      config:
        key_names:
        - apikey
  plugins:
  - id: 0b5c1d3e-0003-4000-8000-000000000002
    name: rate-limiting
    config:
      minute: 5
      policy: local
  - id: 0b5c1d3e-0003-4000-8000-000000000003
    name: acl
    instance_name: bulk-acl-1
    config:
      allow:
      - bulk-group
- id: 0b5c1d3e-0001-4000-8000-000000000002
  name: bulk-svc-2
  host: example.com
  port: 80
  protocol: http
  plugins:
  - id: 0b5c1d3e-0003-4000-8000-000000000004
    name: acl
    instance_name: bulk-acl-2
    config:
      allow:
      - bulk-group
upstreams:
- id: 0b5c1d3e-0004-4000-8000-000000000001
  name: bulk-upstream
  healthchecks:
    active:
      headers:
        x-health:
        - "1"
      http_path: /status
  targets:
  - id: 0b5c1d3e-0005-4000-8000-000000000001
    target: 198.51.100.11:80
