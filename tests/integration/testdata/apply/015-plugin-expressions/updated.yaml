_format_version: "3.0"
plugins:
- id: 6f5c0bb0-8e5c-4d3e-9d5b-1c1f2f0a9a11
  name: rate-limiting-advanced
  config:
    limit: [5]
    window_size: [60]
    strategy: local
    namespace: expressions-test
  expressions:
    limit: ["7*10"]
  enabled: true
- id: 8f2c4a6e-1b3d-4e5f-9a7b-0c1d2e3f4a5b
  name: rate-limiting
  config:
    policy: local
    minute: 10
    day: 1000
  expressions:
    minute: 'consumer.username == "vip" ? 20 : 5'
    day: 'consumer.username == "vip" ? 20000 : 5000'
  enabled: true
