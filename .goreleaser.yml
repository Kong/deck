universal_binaries:
- replace: true
builds:
- id: deck
  env:
  - CGO_ENABLED=0
  goos:
  - linux
  - darwin
  - windows
  - freebsd
  goarch:
  - amd64
  - arm64
  ignore:
    - goos: freebsd
      goarch: arm64
    - goos: windows
      goarch: arm64
  flags:
  - -trimpath
  ldflags:
  - -s -w -X github.com/kong/deck/cmd.VERSION={{ .Tag }} -X github.com/kong/deck/cmd.COMMIT={{ .ShortCommit }}
archives:
# The default archive: tar.gz for every platform, unchanged.
- id: default
# A zip of the Windows binary, for winget. winget reads zip archives only.
- id: winget
  format: zip
  format_overrides:
  - goos: linux
    format: none
  - goos: darwin
    format: none
  - goos: freebsd
    format: none
notarize:
  macos:
    - enabled: '{{ isEnvSet "APPLE_SIGNING_CERTIFICATE_P12_BASE64" }}'
      ids:
        - deck
      sign:
        certificate: "{{.Env.APPLE_SIGNING_CERTIFICATE_P12_BASE64}}"
        password: "{{.Env.APPLE_SIGNING_CERTIFICATE_PASSWORD}}"
      notarize:
        issuer_id: "{{.Env.APPLE_NOTARY_API_ISSUER_ID}}"
        key_id: "{{.Env.APPLE_NOTARY_API_KEY_ID}}"
        key: "{{.Env.APPLE_NOTARY_API_PRIVATE_KEY_BASE64}}"
        wait: true
        timeout: 5m
checksum:
  name_template: 'checksums.txt'
snapshot:
  name_template: "{{ .Tag }}"
nfpms:
- file_name_template: '{{ .ProjectName }}_{{ .Tag }}_{{ .Arch }}'
  homepage: https://github.com/kong/deck
  description: Declarative configuration for Kong
  maintainer: Harry Bagdi <harrybagdi@gmail.com>
  license: Apache License v2.0
  formats:
  - deb
  - rpm
brews:
- tap:
    owner: kong
    name: homebrew-deck
  commit_author:
    name: Harry Bagdi
    email: harrybagdi@gmail.com
  homepage: "https://github.com/kong/deck"
  description: Declarative configuration for Kong
  skip_upload: true
  test: |
      system "#{bin}/deck", "version"
winget:
- name: deck
  publisher: Kong
  package_identifier: Kong.deck
  publisher_url: https://konghq.com
  publisher_support_url: https://github.com/Kong/deck/issues
  homepage: https://github.com/kong/deck
  short_description: Declarative configuration for Kong
  description: |-
    decK manages the configuration of Kong Gateway and Kong Konnect declaratively.
    It exports, validates, diffs and syncs configuration files.
  license: Apache-2.0
  license_url: https://github.com/Kong/deck/blob/main/LICENSE
  release_notes_url: https://github.com/Kong/deck/releases/tag/{{ .Tag }}
  tags:
  - kong
  - api-gateway
  - declarative-configuration
  - cli
  ids:
  - winget
  # Without the token, GoReleaser writes the manifests into dist/ and opens no
  # pull request. With it, a pre-release tag still opens none.
  skip_upload: '{{ if isEnvSet "WINGET_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
  repository:
    owner: Kong
    name: winget-pkgs
    branch: Kong.deck-{{ .Version }}
    token: '{{ envOrDefault "WINGET_GITHUB_TOKEN" "" }}'
    pull_request:
      enabled: true
      base:
        owner: microsoft
        name: winget-pkgs
        branch: master
